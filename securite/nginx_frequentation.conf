# Proxy HTTPS devant le tableau de bord (Linux, nginx).
# A copier dans /etc/nginx/conf.d/ ; adapter server_name et les chemins des certificats.
# Streamlit ecoute sur 127.0.0.1:8501 (.streamlit/config.toml : address = "127.0.0.1", port = 8501).
# Si le port change dans config.toml, changer aussi proxy_pass plus bas.
# RHEL / Rocky / Alma (SELinux actif) : autoriser nginx a joindre Streamlit, sinon erreur 502 :
#     sudo setsebool -P httpd_can_network_connect 1
# Installation : sudo cp nginx_frequentation.conf /etc/nginx/conf.d/ ; sudo nginx -t ; sudo systemctl reload nginx

server_tokens off;                                   # ne pas afficher la version de nginx
limit_req_zone $binary_remote_addr zone=tdb:10m rate=20r/s;   # anti-inondation : 20 requetes/s par poste
limit_conn_zone $binary_remote_addr zone=tdb_conn:10m;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {                                             # HTTP -> HTTPS
    listen 80;
    server_name tdb-frequentation.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name tdb-frequentation.local;

    ssl_certificate     /etc/ssl/tdb/tdb.crt;
    ssl_certificate_key /etc/ssl/tdb/tdb.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets off;

    # En-tetes de securite
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.basemaps.cartocdn.com; font-src 'self' data:; connect-src 'self' ws: wss:; frame-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    client_max_body_size 1m;                         # lecture seule : aucun envoi de fichier
    limit_conn tdb_conn 30;

    # Seules les methodes de lecture sont acceptees
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }

    location / {
        limit_req zone=tdb burst=60 nodelay;
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;         # WebSocket (mise a jour en direct)
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
        proxy_hide_header Server;
    }

    # Points internes de Streamlit inutiles en lecture seule
    location ~ ^/_stcore/(upload_file|metrics) { return 404; }
}
